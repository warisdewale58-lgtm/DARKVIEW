/* story */
.story{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--space-2xl);align-items:center}
.story h2{font-size:clamp(32px,4.6vw,58px);font-weight:900;margin:0 0 var(--space-lg)}
.story p{color:var(--mute);margin-bottom:var(--space-md);max-width:54ch}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.pillars>div{padding:var(--space-lg);background:var(--panel);border-radius:var(--r-md)}
.pillars b{font-family:var(--f-display);font-size:16px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:var(--space-2xs)}
.pillars span{color:var(--mute);font-size:15px}
/* info + faq */
.info3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-md)}
.box{background:var(--panel);padding:var(--space-lg);border-radius:var(--r-lg)}
.box h3{font-size:20px;margin:var(--space-2xs) 0 var(--space-md)}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:11px;color:oklch(83% 0.008 265);font-size:15px}
.box li{padding-left:18px;position:relative}
.box li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:2px;border-radius:2px;background:var(--brass)}
details{border-bottom:1px solid var(--rule);padding:var(--space-md) 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:var(--space-md);font-size:16px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--brass-l);font-size:22px;line-height:1;font-family:var(--f-mono);transition:transform var(--dur-short) var(--expo)}
details[open] summary::after{content:"–"}
details p{color:var(--mute);margin-top:var(--space-sm);max-width:70ch;font-size:15px}
.faq{max-width:860px}
/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)}
.crow{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-md) 0;border-bottom:1px solid var(--rule);min-width:0}
.crow:last-child{border:0}
.crow svg{width:22px;height:22px;stroke:var(--brass);fill:none;stroke-width:1.5;flex:none;margin-top:2px}
.crow small{display:block;color:var(--mute);font-size:13px}
.crow b{overflow-wrap:anywhere;font-weight:600}
.crow .cp{margin-left:auto;font-size:13px;color:var(--brass-l);flex:none;font-family:var(--f-mono);font-weight:700}
form.msg{display:grid;gap:var(--space-sm)}
/* newsletter + footer */
.news{margin-top:var(--space-3xl);background:var(--panel);border-radius:var(--r-xl);padding:var(--space-xl);display:flex;gap:var(--space-lg);justify-content:space-between;align-items:center;flex-wrap:wrap;max-width:var(--wrap);margin-inline:auto}
.news h2{font-size:clamp(24px,3.2vw,38px);font-weight:900}
footer{border-top:1px solid var(--rule);margin:var(--space-3xl) calc(-1*max(20px,env(safe-area-inset-left,0px))) 0;padding:var(--space-2xl) max(20px,env(safe-area-inset-left,0px)) var(--space-lg);background:oklch(11.5% 0.006 265)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:var(--space-xl);max-width:var(--wrap);margin:0 auto}
.fgrid h4{font-size:14px;font-weight:600;color:var(--text);margin:0 0 var(--space-sm)}
.fgrid a,.fgrid p{display:block;color:var(--mute);font-size:15px;margin-bottom:var(--space-xs);overflow-wrap:anywhere}
.fgrid a{transition:color var(--dur-micro)}
.fgrid a:hover{color:var(--text)}
.logo{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.logo i{width:11px;height:11px;border:2px solid var(--brass);border-radius:50%;display:inline-block;position:relative;flex:none}
.logo i::after{content:"";position:absolute;inset:2px;background:var(--brass);border-radius:50%}
.social{display:flex;gap:var(--space-xs);margin-top:var(--space-md)}
.social a{width:42px;height:42px;border:1px solid var(--line);border-radius:var(--r-pill);display:grid;place-items:center;margin:0;transition:border-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.social a:hover{border-color:var(--text);transform:translateY(-2px)}
.social svg{width:18px;height:18px;fill:var(--text)}
.legal{max-width:var(--wrap);margin:var(--space-xl) auto 0;padding-top:var(--space-lg);border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:var(--space-sm);flex-wrap:wrap;color:var(--mute);font-size:14px}
.pay{display:flex;gap:var(--space-xs);flex-wrap:wrap}
.pay span{border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 13px;font-size:13px;font-family:var(--f-mono)}
/* overlays: spring sheets */
.scrim{position:fixed;inset:0;background:oklch(6% 0.005 265 / .6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:300;opacity:0;pointer-events:none;transition:opacity var(--dur-short) var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);z-index:400;transform:translateX(105%);transition:transform var(--dur-long) var(--spring);display:flex;flex-direction:column;border-left:1px solid var(--rule);border-radius:var(--r-lg) 0 0 var(--r-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow-2)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--rule)}
.dh h3{font-size:20px}
.dbody{flex:1;overflow-y:auto;padding:var(--space-xs) var(--space-lg)}
.dfoot{padding:var(--space-md) var(--space-lg);border-top:1px solid var(--rule);display:grid;gap:var(--space-sm)}
.line{display:grid;grid-template-columns:76px 1fr auto;gap:var(--space-sm);padding:var(--space-md) 0;border-bottom:1px solid var(--rule)}
.line .th{aspect-ratio:1;background:var(--panel2);border-radius:var(--r-sm);display:grid;place-items:center;overflow:hidden}
.line .th img{width:100%;height:100%;object-fit:cover}
.line .th svg{width:80%}
.line b{font-size:15px;display:block;font-weight:600}
.line small{color:var(--mute);font-size:13px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);margin-top:var(--space-xs);overflow:hidden}
.qty button{width:36px;height:36px;font-size:16px;transition:background-color var(--dur-micro) var(--ease-out)}
.qty button:hover{background:var(--panel2)}
.qty span{width:34px;display:grid;place-items:center;font-size:13px;font-family:var(--f-mono)}
.rm{color:var(--mute);font-size:12px;text-align:right;font-family:var(--f-mono)}
.rm:hover{color:var(--bad)}
.sum{display:flex;justify-content:space-between;font-size:15px;color:oklch(83% 0.008 265);font-variant-numeric:tabular-nums}
.sum.t{color:var(--text);font-weight:700;font-size:17px;font-family:var(--f-mono)}
.promo{display:flex;gap:var(--space-xs)}
.promo input{border-radius:var(--r-pill)}
.bar-free{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar-free i{display:block;height:100%;border-radius:4px;background:var(--brass);transition:transform var(--dur-long) var(--expo);transform-origin:left}
.modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:var(--space-md)}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-xl);width:min(960px,100%);max-height:calc(100% - 8px);overflow-y:auto;position:relative;animation:sheet-in var(--dur-long) var(--spring);box-shadow:var(--shadow-2)}
@keyframes sheet-in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.sheet .x{position:absolute;top:var(--space-sm);right:var(--space-sm);z-index:2;width:40px;height:40px;border-radius:50%;background:oklch(13% 0.006 265 / .65);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:20px;transition:background-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.sheet .x:hover{background:var(--panel2)}
.sheet .x:active{transform:scale(.9)}
.pd{display:grid;grid-template-columns:1fr 1fr}
.pd .pic{background:oklch(25% 0.006 265);display:grid;place-items:center;min-height:360px;position:relative;overflow:hidden;border-radius:var(--r-xl) 0 0 var(--r-xl)}
.pd .pic img{width:100%;height:100%;object-fit:cover;display:block;animation:pd-img .7s var(--expo)}
@keyframes pd-img{from{opacity:.4;transform:scale(1.04)}to{opacity:1;transform:none}}
.pd .pic svg{width:72%}
.pd .txt{padding:var(--space-xl) var(--space-lg);display:grid;gap:var(--space-md);align-content:start;min-width:0}
.pd h2{font-size:28px}
.opt label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:var(--space-xs)}
.sizes,.colors{display:flex;gap:var(--space-xs);flex-wrap:wrap}
.sz{min-width:48px;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;font-weight:600;transition:border-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),background-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.sz:hover{border-color:var(--text)}
.sz:active{transform:scale(.93)}
.sz.on{border-color:var(--text);color:var(--ink);background:var(--text)}
.sz.out{opacity:.4;text-decoration:line-through;pointer-events:none}
.cl{width:38px;height:38px;border-radius:50%;border:2px solid transparent;padding:3px;background:none;transition:border-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.cl:active{transform:scale(.9)}
.cl i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid var(--line)}
.cl.on{border-color:var(--brass)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.co{padding:var(--space-xl) var(--space-lg);display:grid;grid-template-columns:1.2fr 1fr;gap:var(--space-xl)}
.co form{display:grid;gap:var(--space-sm);min-width:0}
.co label{font-size:14px;color:var(--mute);display:block;margin-bottom:5px}
.co h2{font-size:26px;grid-column:1/-1}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--space-sm);cursor:pointer;font-size:14px;transition:border-color var(--dur-micro) var(--ease-out),background-color var(--dur-micro)}
.radio input{width:auto;margin-top:3px;accent-color:var(--brass)}
.radio:has(input:checked){border-color:var(--brass);background:oklch(64% 0.21 27 / .06)}
.radio small{display:block;color:var(--mute)}
.recap{background:var(--ink);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--space-lg);align-self:start;display:grid;gap:10px}
.done{padding:var(--space-2xl) var(--space-lg);text-align:center;display:grid;gap:var(--space-md);justify-items:center}
.done .tick{width:64px;height:64px;border:2px solid var(--ok);border-radius:50%;display:grid;place-items:center;color:var(--ok);font-size:30px;animation:pop .6s var(--spring)}
.done pre{background:var(--ink);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--space-sm);text-align:left;font-size:12px;white-space:pre-wrap;max-width:100%;color:var(--mute);margin:0;font-family:var(--f-mono)}
.guide{padding:var(--space-lg);overflow-x:auto}
.guide table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px;font-variant-numeric:tabular-nums}
.guide th,.guide td{border-bottom:1px solid var(--rule);padding:10px 8px;text-align:left}
.guide th{color:var(--mute);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px) scale(.95);background:var(--text);color:var(--ink);padding:13px 24px;border-radius:var(--r-pill);font-size:14px;font-weight:600;z-index:500;opacity:0;transition:opacity var(--dur-short) var(--ease-out),transform var(--dur-long) var(--spring);pointer-events:none;max-width:calc(100% - 32px);box-shadow:var(--shadow-2)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.wa{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:100;width:54px;height:54px;border-radius:50%;background:oklch(70% 0.17 155);display:grid;place-items:center;box-shadow:0 8px 24px oklch(6% 0.005 265 / .5);transition:transform var(--dur-short) var(--spring)}
.wa:hover{transform:scale(1.1)}
.wa:active{transform:scale(.94)}
.wa svg{width:28px;height:28px;fill:oklch(98% 0.005 155)}
#mnav{position:fixed;top:0;left:0;bottom:0;width:min(320px,86%);background:var(--panel);z-index:400;transform:translateX(-105%);transition:transform var(--dur-long) var(--spring);padding:70px 26px 26px;display:grid;gap:6px;align-content:start;border-right:1px solid var(--rule);border-radius:0 var(--r-lg) var(--r-lg) 0;box-shadow:var(--shadow-2)}
#mnav.on{transform:none}
#mnav a{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--rule)}
#mnav .x{position:absolute;top:14px;right:14px;width:40px;height:40px;font-size:22px}
.pcol{min-width:0}
.thumbs{display:flex;gap:var(--space-xs);flex-wrap:wrap;padding:10px;background:var(--ink)}
.thumbs button{width:62px;height:62px;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;opacity:.6;transition:opacity var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)}
.thumbs button:active{transform:scale(.92)}
.thumbs button.on{border-color:var(--brass);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.trk-ok{display:grid;gap:var(--space-sm)}
.acct{width:100%;max-width:440px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--ink);text-align:left;overflow:hidden}
.acct .ar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--rule)}
.acct .ar:last-child{border:0}
.acct small{display:block;color:var(--mute);font-size:12px}
.acct b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere;font-family:var(--f-mono);font-weight:600}
.acct .cp{color:var(--brass-l);font-size:13px;flex:none;font-family:var(--f-mono);font-weight:700}
.steps{text-align:left;color:var(--mute);font-size:14px;margin:0;padding-left:20px;max-width:440px;display:grid;gap:6px}
.steps b{color:var(--text)}
/* fly-to-cart clone */
.fly{position:fixed;z-index:550;pointer-events:none;object-fit:cover;border-radius:var(--r-md);box-shadow:var(--shadow-2)}
/* scroll reveals: rise + settle, staggered */
.rv{opacity:0;transform:translateY(32px) scale(.985);transition:opacity var(--dur-reveal) var(--ease-out),transform var(--dur-reveal) var(--expo);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}
/* admin (kept, retoned to match) */
#adm{position:fixed;inset:0;z-index:600;background:var(--ink);display:none;grid-template-columns:220px 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#adm.on{display:grid}
.a-side{border-right:1px solid var(--rule);background:oklch(11.5% 0.006 265);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.a-side .logo{font-size:15px;padding:6px 10px 16px}
.a-tab{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:var(--r-sm);text-align:left;font-size:13px;font-weight:600;color:var(--mute);width:100%;transition:background-color var(--dur-micro),color var(--dur-micro)}
.a-tab:hover{background:var(--panel)}
.a-tab.on{background:var(--panel2);color:var(--brass)}
.a-tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.a-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.a-top{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--rule)}
.a-top h2{font-size:22px;margin-right:auto}
.a-body{flex:1;overflow:auto;padding:22px}
.a-st{font-size:12px;color:var(--mute)}
.a-st.dirty{color:var(--brass)}
.a-btn{padding:9px 16px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:border-color var(--dur-micro),color var(--dur-micro),background-color var(--dur-micro)}
.a-btn:hover{border-color:var(--text);color:var(--text)}
.a-btn.pri{background:var(--text);border-color:var(--text);color:var(--ink)}
.a-btn.pri:hover{background:var(--brass);border-color:var(--brass);color:var(--accent-ink)}
.a-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.a-btn[disabled]{opacity:.4;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-sm);margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-md);padding:var(--space-md);min-width:0}
.kpi small{display:block;font-size:12px;color:var(--mute)}
.kpi b{font-family:var(--f-display);font-size:24px;display:block;margin-top:6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)}
.a-card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-md);padding:18px;min-width:0}
.a-card h3{font-size:15px;letter-spacing:.02em;margin-bottom:14px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.rank:last-child{border:0}
.rank .n{font-family:var(--f-display);font-weight:800;color:var(--brass)}
.rank .nm{min-width:0}
.rank .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--brass)}
.rank .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.a-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.a-tools input[type=search],.a-tools input[type=text]{max-width:300px}
.a-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-md)}
table.a-t{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
.a-t th{text-align:left;font-size:12px;color:var(--mute);padding:11px 12px;background:var(--panel);border-bottom:1px solid var(--rule);white-space:nowrap;font-weight:600}
.a-t td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.a-t tr.off td{opacity:.5}
.a-t .th{width:46px;height:46px;background:var(--panel2);border-radius:var(--r-sm);display:grid;place-items:center;overflow:hidden}
.a-t .th svg{width:80%}.a-t .th img{width:100%;height:100%;object-fit:cover}
.a-t input[type=number]{width:96px;padding:7px 8px}
.a-t select{padding:7px 8px;width:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .a-btn{padding:6px 10px;font-size:11px}
.a-f{display:grid;gap:14px;max-width:760px}
.a-f.wide{max-width:none}
.a-f label,.a-m label.l{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.a-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.a-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-sm)}
.chk{display:flex;gap:var(--space-xs);flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px;font-size:13px;margin:0;color:var(--text);cursor:pointer}
.chk input{width:auto;accent-color:var(--brass)}
.chk label:has(input:checked){border-color:var(--brass)}
.chk .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);display:inline-block}
#adm .scrimx{position:fixed;inset:0;background:oklch(6% 0.005 265 / .72);z-index:640;display:none}
.a-m{position:fixed;z-index:650;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--space-lg);display:none}
.a-m.on,#adm .scrimx.on{display:block}
.a-m h3{font-size:22px;margin-bottom:var(--space-md)}
.a-note{color:var(--mute);font-size:14px}
.a-note.err{color:var(--bad)}
.thumb-up{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap}
.thumb-up .pv{width:70px;height:70px;background:var(--panel2);border-radius:var(--r-sm);display:grid;place-items:center;overflow:hidden}
.thumb-up .pv img,.thumb-up .pv svg{width:100%;height:100%;object-fit:cover}
.status{font-size:11px;font-weight:700;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-pill);font-family:var(--f-mono)}
.a-ph{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin-top:var(--space-xs)}
.a-ph .pv{width:64px;height:64px;background:var(--panel2);border-radius:var(--r-sm);display:grid;place-items:center;overflow:hidden}
.a-ph .pv img,.a-ph .pv svg{width:100%;height:100%;object-fit:cover}
.a-ph .in{display:grid;gap:6px;min-width:0}
#adLock{position:fixed;inset:0;z-index:700;background:oklch(6% 0.005 265 / .75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:var(--space-md)}
#adLock.on{display:flex}
.lk{width:min(380px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);padding:30px 26px;display:grid;gap:var(--space-sm);text-align:center;justify-items:center;animation:sheet-in var(--dur-long) var(--spring)}
.lk form{display:grid;gap:10px;width:100%}
.lk-i{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center}
.lk-i svg{width:24px;height:24px;stroke:var(--brass);fill:none;stroke-width:1.7}
.lk h3{font-size:22px}
.lk p{color:var(--mute);font-size:14px}
.lk #lkErr{color:var(--bad);font-size:13px}
.ai-log{max-height:340px;overflow-y:auto;display:grid;gap:10px;padding:4px 2px;margin-bottom:10px}
.ai-m{padding:11px 14px;border-radius:var(--r-md);font-size:14px;max-width:92%;overflow-wrap:anywhere}
.ai-m.u{background:var(--panel2);justify-self:end;border:1px solid var(--rule)}
.ai-m.b{background:var(--ink);border:1px solid var(--rule);justify-self:start;display:grid;gap:var(--space-xs)}
.ai-m ul{margin:0;padding-left:18px;color:var(--mute);font-size:13px}
.ai-think{color:var(--mute)}
.ai-in{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
/* responsive */
@media(max-width:1020px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .story,.contact{grid-template-columns:1fr}
  .info3{grid-template-columns:1fr}
  .trust{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .dvh nav.main{display:none}
  .menu-btn{display:grid}
  .search{width:auto;flex:1}
}
@media(max-width:900px){
  #adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .a-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:var(--space-xs)}
  .a-side .logo{display:none}
  .a-tab{width:auto;white-space:nowrap}
  .kpis{grid-template-columns:1fr 1fr}
  .a-grid,.a-2,.a-3{grid-template-columns:1fr}
  .a-top{padding:var(--space-sm) 14px}.a-body{padding:14px}
}
@media(max-width:640px){
  body{font-size:16px}
  .dvh-in{gap:var(--space-xs);height:64px}
  .bt b{font-size:16px}.bt small{display:none}
  .mono{width:36px;height:36px;font-size:12px}
  .search{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-lg) var(--space-sm)}
  /* Apple-style bottom sheets on phone */
  .modal{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:92svh;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;animation:sheet-up .6s var(--spring)}
  .sheet::before{content:"";position:sticky;top:8px;display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto -12px;z-index:3}
  @keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92svh;border-radius:var(--r-lg) var(--r-lg) 0 0;border-left:0;border-top:1px solid var(--rule);transform:translateY(105%)}
  .drawer.on{transform:none}
  .pd,.co{grid-template-columns:1fr}
  .pd .pic{min-height:260px;border-radius:0}
  .pd .txt,.co{padding:var(--space-lg) var(--space-md)}
  .fgrid{grid-template-columns:1fr}
  .news{padding:var(--space-lg) var(--space-md);border-radius:var(--r-lg)}
  .twocol{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr 1fr}
  .count{margin-left:0;grid-column:1/-1}
  section{padding-block:var(--space-2xl) 0}
  .dv-hero{min-height:min(94svh,780px);border-radius:0 0 var(--r-lg) var(--r-lg)}
  .h-copy{padding-bottom:var(--space-xl)}
  .h-copy h1{max-width:9ch}
  .btn2{min-height:48px;padding:0 22px;font-size:13px}
  .bag{padding:0 16px;height:40px}
  .card h3{font-size:16px}
  .pillars{grid-template-columns:1fr}
  .trust>div{padding:var(--space-sm) var(--space-md)}
  .tk span{font-size:13px;letter-spacing:.08em}
}
@media(max-width:420px){.dvh #wishBtn{display:none}.pillx{font-size:12px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .rv,.dv-hero .hero-media,.dv-hero .h-top,.dv-hero .h-copy>*{opacity:1;transform:none}
  .tk{animation:none!important}
}

/* ===== scroll reveals (one pass, transform+opacity only) ===== */
let rvIO=null;
function observeRv(root){
  const els=[...(root||document).querySelectorAll('.rv:not(.in)')];
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){els.forEach(e=>e.classList.add('in'));return}
  if(!rvIO)rvIO=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');rvIO.unobserve(x.target)}}),{rootMargin:'0px 0px -10% 0px',threshold:.08});
  els.forEach(e=>rvIO.observe(e));
}
/* ===== motion: hero entrance, gentle parallax, ticker loop ===== */
function initMotion(){
  const hero=$('#banner');if(!hero)return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>hero.classList.add('play')));
  const tk=$('#tkRow');if(tk&&!tk.dataset.dup){tk.dataset.dup='1';tk.innerHTML+=tk.innerHTML}
  if(initMotion.bound)return;initMotion.bound=true;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let tick=false;
  const upd=()=>{tick=false;const h=$('#banner');if(!h)return;const m=h.querySelector('.hero-media');if(!m||!('translate' in m.style))return;const r=h.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const p=Math.min(1,Math.max(0,-r.top/r.height));m.style.translate='0 '+(p*6).toFixed(2)+'%'};
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
}
/* ===== fly-to-cart: product photo arcs into the bag ===== */
function flyToCart(){
  const src=document.querySelector('#pmSheet .pd .pic img'),bag=$('#cartBtn');
  if(!src||!bag||!src.animate||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=src.getBoundingClientRect(),b=bag.getBoundingClientRect();
  const c=src.cloneNode();c.className='fly';c.removeAttribute('loading');
  c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';
  document.body.appendChild(c);
  const dx=b.left+b.width/2-(r.left+r.width/2),dy=b.top+b.height/2-(r.top+r.height/2);
  const a=c.animate([
    {transform:'translate(0,0) scale(1)',opacity:.95},
    {transform:'translate('+(dx*.5)+'px,'+(dy*.5-70)+'px) scale(.45)',opacity:.9,offset:.55},
    {transform:'translate('+dx+'px,'+dy+'px) scale(.06)',opacity:0}
  ],{duration:620,easing:'cubic-bezier(.32,.72,0,1)'});
  a.onfinish=()=>c.remove();
}

/* ===== admin password lock, theme, and AI assistant ===== */
const PW_SALT='dv-admin:';
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;
  b.push(0x80);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;
    }
    h=[(h[0]+a)|0,(h[1]+b2)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
const pwHash=p=>sha256(PW_SALT+p);

async function vcCall(path,body){
  let r;try{r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}catch(e){throw{code:'network',msg:'No internet connection.'}}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw{code:j.code||('http_'+r.status),msg:j.error||('Error '+r.status)};
  return j;
}

function vcShrink(file){return new Promise((ok,no)=>{
  if(!/^image\//.test(file.type))return no({code:'video_unsupported',msg:'Only photos can be uploaded here. Paste a video link instead.'});
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82).split(',')[1])};
  im.onerror=()=>no({code:'bad_image',msg:'That image could not be read.'});im.src=u})}
async function vcUpload(file){
  const b64=await vcShrink(file);
  const j=await vcCall('/api/upload',{pw:ADM.pw||'',data:b64});
  return{url:j.url};
}

const THEME_KEYS=['ink','panel','panel2','line','text','mute','brass','brass-d'];
const okColor=x=>typeof x==='string'&&(/^#[0-9a-f]{3,8}$/i.test(x.trim())||/^(rgb|hsl)a?\([\d\s.,%\/-]+\)$/i.test(x.trim()));
const cleanCss=c=>String(c||'').replace(/<|>/g,'').replace(/@import[^;]*;?/gi,'').replace(/expression\s*\(|javascript:/gi,'').slice(0,12000);
function applyTheme(){
  let st=document.getElementById('dvTheme');
  if(!st){st=document.createElement('style');st.id='dvTheme'}document.body.appendChild(st);

function showLock(){

  if(!el){el=document.createElement('div');el.id='adLock';document.body.appendChild(el)}
  el.innerHTML=`<div class="lk" role="dialog" aria-modal="true" aria-label="Admin password"><div class="lk-i"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><h3>Admin access</h3><p>Enter the admin password to manage the store.</p>
  <form id="lkForm" novalidate><input id="lkPw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Admin password"><p id="lkErr" hidden></p><button class="btn block" type="submit">Unlock</button><button class="btn ghost block" type="button" data-lk-x>Cancel</button></form></div>`;
  el.classList.add('on');closeAll();
  setTimeout(()=>{const i=document.getElementById('lkPw');if(i)i.focus()},30);
}
function hideLock(){const el=document.getElementById('adLock');if(el)el.classList.remove('on')}
function lockAdmin(){isAdmin=false;try{sessionStorage.removeItem('dv_adm')}catch(e){}const ab=$('#adminBtn');if(ab)ab.hidden=true;closeAdmin();hideLock()}
document.addEventListener('submit',e=>{
  if(e.target.id!=='lkForm')return;
  const err=document.getElementById('lkErr'),v=document.getElementById('lkPw').value,now=Date.now();
  if(now<lockUntil){err.textContent='Too many tries. Wait '+Math.ceil((lockUntil-now)/1000)+' seconds.';err.hidden=false;return}
  if(pwHash(v)===S.adminHash){lockFails=0;isAdmin=true;ADM.pw=v;try{if(HOSTED)sessionStorage.setItem('dv_adm','1')}catch(x){}const ab=$('#adminBtn');if(ab)ab.hidden=false;hideLock();openAdmin();return}
  lockFails++;if(lockFails>=5){lockUntil=now+30000;lockFails=0}
  err.textContent=lockUntil>now?'Too many tries. Wait 30 seconds.':'That password is not right.';err.hidden=false;
});
document.addEventListener('click',e=>{if(e.target.closest&&(e.target.closest('[data-lk-x]')||e.target.id==='adLock'))hideLock()});
/* ----- change password card ----- */
function pwCard(){
  return `<div class="a-card" style="margin-top:16px"><h3>Admin password</h3><p class="a-note" style="margin-bottom:14px">The admin button asks for this password. Change it here, then press Publish changes so it applies on the live site. Keep it private; anyone who has it can open this dashboard.</p>
  <div class="a-f"><div><label for="pw_cur">Current password</label><input id="pw_cur" type="password" autocomplete="current-password"></div><div class="a-2"><div><label for="pw_new">New password (8+ characters)</label><input id="pw_new" type="password" autocomplete="new-password"></div><div><label for="pw_new2">Repeat new password</label><input id="pw_new2" type="password" autocomplete="new-password"></div></div>
  <p class="a-note" id="pw_msg" hidden></p><div><button class="a-btn pri" data-a="pwsave">Change password</button></div></div></div>`;
}
document.addEventListener('click',e=>{
  const m=e.target.closest&&e.target.closest('#adm [data-a]');if(!m)return;
  if(m.dataset.a==='lock'){lockAdmin();return}

  const g=id=>document.getElementById(id).value,msg=document.getElementById('pw_msg'),say=(t,bad)=>{msg.textContent=t;msg.className='a-note'+(bad?' err':'');msg.hidden=false};

  if(g('pw_new').length<8)return say('Use at least 8 characters.',1);
  if(g('pw_new')!==g('pw_new2'))return say('The two new passwords do not match.',1);
  if(pwHash(g('pw_new'))===S.adminHash)return say('That is the same as the current password.',1);
  S.adminHash=pwHash(g('pw_new'));ADM.pwNext=g('pw_new');ADM.pw=g('pw_new');dirty();
  ['pw_cur','pw_new','pw_new2'].forEach(i=>document.getElementById(i).value='');
  say('Password changed. Press Publish changes (top right) so it works on the live site.');
});
/* ===== AI assistant ===== */
ADM.ai={msgs:[],busy:false,draft:'',snap:null};
const AI_EX=['Change the announcement bar to say Free delivery in Abuja this weekend','Make the red accent colour bone white','Add a category called Caps','Reduce every product price by 10%','Set the delivery fee for Abuja to ₦3,000'];
function aiCard(){
  const a=ADM.ai;
  const log=a.msgs.map((m,i)=>m.role==='user'?`<div class="ai-m u">${esc(m.t)}</div>`:`<div class="ai-m b">${esc(m.t)}${m.lines&&m.lines.length?`<ul>${m.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}${m.skipped&&m.skipped.length?`<div class="a-note err">Skipped: ${esc(m.skipped.join('; '))}</div>`:''}${m.undo&&i===a.msgs.length-1?`<button class="a-btn" data-a="aiundo">Undo this change</button>`:''}</div>`).join('');
  return `<div class="a-card"><h3>AI assistant</h3>
  <p class="a-note" style="margin-bottom:12px">Tell the assistant what to change in plain words. It can edit the text on your site, colours and style, products and prices, categories, delivery areas and the promo code. Changes show straight away; press Publish changes to make them live. It cannot upload photos (use the product editor for that) or change the password.</p>
  ${sampleCap?`<div class="ai-log" id="aiLog">${log||'<p class="a-note">Nothing yet. Try one of these:</p>'}${a.busy?'<div class="ai-m b ai-think">Thinking…</div>':''}</div>
  ${a.msgs.length?'':`<div class="chk" style="margin:10px 0">${AI_EX.map(t=>`<label style="cursor:pointer" data-a="aiex" data-t="${esc(t)}">${esc(t)}</label>`).join('')}</div>`}
  <div class="ai-in"><textarea id="aiIn" rows="2" placeholder="What should I change?" aria-label="Tell the AI assistant what to change" ${a.busy?'disabled':''}>${esc(a.draft)}</textarea><button class="a-btn pri" data-a="aisend" ${a.busy?'disabled':''}>${a.busy?'Working…':'Send'}</button></div>`
  :`<p class="a-note err">The AI assistant is not available in this view. Open the live page while signed in to Claude and try again.</p>`}</div>`;
}
const normName=s=>String(s||'').trim().toLowerCase();
function findProd(r){if(r==null)return null;const id=+r.id;if(r.id!=null&&D.products.find(p=>p.id===id))return D.products.find(p=>p.id===id);const n=normName(r.name||r.n);if(!n)return null;return D.products.find(p=>normName(p.n)===n)||D.products.find(p=>normName(p.n).includes(n))||null}
const SIZES=['S','M','L','XL','XXL'];
function cleanProd(f,p,out,skip){
  const num=(k,min=0)=>{const v=+f[k];if(!isFinite(v)||v<min){skip.push(k+' must be a number');return}p[k]=Math.round(v)};
  if('n' in f&&String(f.n).trim())p.n=String(f.n).trim().slice(0,80);
  if('d' in f)p.d=String(f.d).slice(0,600);
  if('b' in f)p.b=String(f.b).slice(0,24);
  if('p' in f){const v=+f.p;if(isFinite(v)&&v>0)p.p=Math.round(v);else skip.push('price must be above zero')}
  if('o' in f)num('o');
  if('stock' in f)num('stock');
  if('c' in f&&String(f.c).trim()){const c=String(f.c).trim();if(!D.categories.includes(c)){D.categories.push(c);out.push('Added category '+c)}p.c=c}
  if('t' in f&&TYPES.some(t=>t[0]===f.t))p.t=f.t;
  if('hidden' in f)p.hidden=!!f.hidden;
  if('featured' in f){p.featured=!!f.featured;if(p.featured)D.products.forEach(x=>{if(x!==p)x.featured=false})}
  if(Array.isArray(f.cl)){const ok=f.cl.filter(c=>D.colors[c]);if(ok.length)p.cl=ok;if(ok.length<f.cl.length)skip.push('unknown colours dropped (add them with setColor first)')}
  if(Array.isArray(f.s)){const ok=f.s.filter(s=>SIZES.includes(s));if(ok.length)p.s=ok}
  if(Array.isArray(f.out))p.out=f.out.filter(s=>SIZES.includes(s));
}
function aiApply(ops){
  const lines=[],skip=[];
  const SK=Object.keys(S).filter(k=>k!=='adminHash'&&k!=='theme');
  (Array.isArray(ops)?ops:[]).slice(0,60).forEach(op=>{
    try{
      switch(op&&op.op){
      case'setSetting':{
        const k=op.key;if(k==='adminHash'||!(SK.includes(k)||k==='customCss')){skip.push('unknown setting '+k);break}
        let v=op.value;
        if(['promoPct'].includes(k)){v=Math.max(0,Math.min(90,+v||0))}
        else if(k==='waNum'){v=String(v).replace(/\D/g,'')}
        else if(k==='customCss'){v=cleanCss(v)}
        else v=String(v).slice(0,1200);
        S[k]=v;lines.push('Changed '+k);break}
      case'setTheme':{
        const k=String(op.var||'').replace(/^--/,'');if(!THEME_KEYS.includes(k)||!okColor(op.value)){skip.push('bad colour '+k);break}
        S.theme=Object.assign({},S.theme,{[k]:op.value.trim()});lines.push('Colour '+k+' → '+op.value);break}
      case'resetTheme':S.theme={};lines.push('Colours reset to the original');break;
      case'customCss':{
        const c=cleanCss(op.css);S.customCss=op.mode==='replace'?c:((S.customCss?S.customCss+'\n':'')+c);lines.push(op.mode==='replace'?'Replaced custom styling':'Added custom styling');break}
      case'updateProduct':{
        const p=findProd(op);if(!p){skip.push('product not found: '+(op.name||op.id));break}
        const f=op.fields||{},before=p.n;cleanProd(f,p,lines,skip);lines.push('Updated '+before+(f.n?' → '+f.n:''));break}
      case'addProduct':{
        const f=op.product||{};if(!f.n||!f.p){skip.push('new product needs a name and price');break}
        const p={id:Math.max(0,...D.products.map(x=>x.id))+1,n:'',c:D.categories[0]||'',t:'tee',p:0,cl:[Object.keys(D.colors)[0]],s:['M','L','XL'],d:'',o:0,out:[],b:'New',stock:10,img:'',imgs:[],ci:{},hidden:false,featured:false};
        cleanProd(f,p,lines,skip);D.products.push(p);lines.push('Added product '+p.n+' (add photos in Products)');break}
      case'removeProduct':{
        const p=findProd(op);if(!p){skip.push('product not found: '+(op.name||op.id));break}
        D.products=D.products.filter(x=>x!==p);cart=cart.filter(l=>l.id!==p.id);wish=wish.filter(w=>w!==p.id);lines.push('Removed '+p.n);break}
      case'addCategory':{const n=String(op.name||'').trim();if(!n||D.categories.includes(n)){skip.push('category exists or empty');break}D.categories.push(n);lines.push('Added category '+n);break}
      case'renameCategory':{const i=D.categories.indexOf(op.from),n=String(op.to||'').trim();if(i<0||!n){skip.push('category not found: '+op.from);break}D.categories[i]=n;D.products.forEach(p=>{if(p.c===op.from)p.c=n});lines.push('Renamed '+op.from+' → '+n);break}
      case'removeCategory':{const i=D.categories.indexOf(op.name);if(i<0||D.categories.length<2){skip.push('cannot remove '+op.name);break}D.categories.splice(i,1);D.products.forEach(p=>{if(p.c===op.name)p.c=D.categories[0]});lines.push('Removed category '+op.name+' (its products moved to '+D.categories[0]+')');break}
      case'setColor':{const n=String(op.name||'').trim();if(!n||!okColor(op.hex)){skip.push('bad colour '+n);break}D.colors[n]=op.hex.trim();CLR[n]=op.hex.trim();lines.push('Colour '+n+' set');break}
      case'updateZone':{
        const z=D.zones.find(x=>normName(x.name)===normName(op.name))||D.zones.find(x=>normName(x.name).includes(normName(op.name)));if(!z){skip.push('area not found: '+op.name);break}
        const f=op.fields||{};['fee','freeOver'].forEach(k=>{if(k in f)z[k]=Math.max(0,+f[k]||0)});['name','eta'].forEach(k=>{if(k in f)z[k]=String(f[k]).slice(0,80)});['pod','on'].forEach(k=>{if(k in f)z[k]=!!f[k]});lines.push('Updated delivery area '+z.name);break}
      case'addZone':{const n=String(op.name||'').trim();if(!n){skip.push('area needs a name');break}D.zones.push({id:slug(),name:n,fee:Math.max(0,+op.fee||0),freeOver:Math.max(0,+op.freeOver||0),eta:String(op.eta||'1 to 2 days'),pod:!!op.pod,on:op.on!==false});lines.push('Added delivery area '+n);break}
      case'removeZone':{const i=D.zones.findIndex(x=>normName(x.name)===normName(op.name));if(i<0){skip.push('area not found: '+op.name);break}D.zones.splice(i,1);lines.push('Removed delivery area '+op.name);break}
      default:skip.push('unknown action '+(op&&op.op))}
    }catch(x){skip.push('could not apply one change')}
  });
  return{lines,skip};
}
function aiState(){
  const s=Object.assign({},S);delete s.adminHash;
  return JSON.stringify({settings:s,categories:D.categories,colors:D.colors,deliveryAreas:D.zones,products:D.products.map(p=>({id:p.id,n:p.n,c:p.c,t:p.t,p:p.p,o:p.o,stock:p.stock,b:p.b,d:p.d,cl:p.cl,s:p.s,out:p.out,hidden:p.hidden,featured:p.featured}))});
}
const AI_RULES=`You are the built-in store assistant for the clothing website "Dark View" (Abuja, Nigeria). The owner is asking you to change their website. Reply with ONLY one JSON object, no markdown fences: {"reply":"one or two friendly sentences","ops":[ ... ]}.
If the request is only a question or is unclear, use "ops":[] and answer or ask one short question in "reply". Never invent product ids; refer to products by id or exact name from the current data. Prices are whole naira numbers.
Allowed ops:
{"op":"setSetting","key":K,"value":V}  K is any key in current settings (name, announce, tagline, mono, bBadge, bKicker, bTitle (use *word* to colour a word red), bSub, bCta, bCta2, bCta2Q, bPerks, heroImg, heroImgAlt, storyH, story1, story2, waNum, phone, email, address, hours, ig, tt, yt, bankName, acctNum, acctName, promoCode, promoPct) or "customCss".
{"op":"setTheme","var":"brass"|"ink"|"panel"|"panel2"|"line"|"text"|"mute"|"brass-d","value":"#hex"}  brass is the red accent, ink the page background (near-black), panel and panel2 are card backgrounds, text the main text colour.
{"op":"resetTheme"}
{"op":"customCss","css":"...","mode":"append"|"replace"}  plain CSS for anything else visual. Useful selectors: body, .ann (announcement bar), header.dvh, .bag, .dv-hero, .h-copy h1, .h-copy p, .btn, .btn2, .btn2.pri, .card, .card h3, .price, .col, .box, footer, .pill, .chip. Keep it small and safe.
{"op":"updateProduct","id":N,"fields":{n,c,p,o,stock,b,d,t,cl,s,out,hidden,featured}}  o is the old (crossed-out) price, 0 for none; cl is an array of existing colour names; s sizes from S,M,L,XL,XXL; t one of hoodie,hoodie2,tee,jacket,pants,shorts,cap,tote.
{"op":"addProduct","product":{n,c,p,o,stock,b,d,t,cl,s}}
{"op":"removeProduct","id":N}
{"op":"addCategory","name":"..."}  {"op":"renameCategory","from":"...","to":"..."}  {"op":"removeCategory","name":"..."}
{"op":"setColor","name":"Maroon","hex":"#800000"}  adds or edits a product colour.
{"op":"updateZone","name":"Abuja (FCT)","fields":{fee,freeOver,eta,pod,on,name}}  {"op":"addZone","name":"...","fee":N,"freeOver":N,"eta":"...","pod":false}  {"op":"removeZone","name":"..."}
You cannot upload photos or videos, change the admin password, read orders, or edit anything outside these ops; say so politely if asked and explain where in the dashboard to do it (photos: Products tab; hero photo and video: Banner & content tab).`;
async function aiSend(){
  const a=ADM.ai,t=(document.getElementById('aiIn')||{}).value||a.draft;if(!t.trim()||a.busy||!sampleCap)return;
  a.msgs.push({role:'user',t:t.trim()});a.draft='';a.busy=true;renderAdmin();
  const hist=a.msgs.slice(-9,-1).map(m=>(m.role==='user'?'Owner: ':'Assistant: ')+m.t).join('\n');
  const input=AI_RULES+'\n\nCURRENT SITE DATA:\n'+aiState()+(hist?'\n\nRECENT CHAT:\n'+hist:'')+'\n\nOWNER REQUEST:\n'+t.trim();
  try{
    const r=await sampleCap(input,{cache:false,modelTier:'default'});
    let obj=null;const tx=String(r.text||'');
    try{obj=JSON.parse(tx.slice(tx.indexOf('{'),tx.lastIndexOf('}')+1))}catch(e){}
    if(!obj||typeof obj!=='object')obj={reply:tx.trim()||'I could not understand that. Try rephrasing.',ops:[]};
    let res={lines:[],skip:[]},snap=null;
    if(Array.isArray(obj.ops)&&obj.ops.length){snap=JSON.stringify(D);res=aiApply(obj.ops);Object.assign(CLR,D.colors);if(res.lines.length){refreshStore();dirty()}else snap=null}
    a.msgs.push({role:'bot',t:String(obj.reply||'Done.'),lines:res.lines,skipped:res.skip,undo:snap});
  }catch(e){
    a.msgs.push({role:'bot',t:e&&e.code==='not_granted'?'I need your permission to use the assistant. Send your request again and choose Allow.':e&&e.msg?e.msg:e&&e.code==='rate_limited'?'The assistant is busy. Wait a minute and try again.':'Something went wrong reaching the assistant. Try again.',lines:[],skipped:[]});
  }
  a.busy=false;renderAdmin();const l=document.getElementById('aiLog');if(l)l.scrollTop=l.scrollHeight;
}
document.addEventListener('click',e=>{
  const m=e.target.closest&&e.target.closest('#adm [data-a]');if(!m)return;
  if(m.dataset.a==='aisend'){aiSend();return}
  if(m.dataset.a==='aiex'){ADM.ai.draft=m.dataset.t;renderAdmin();const i=document.getElementById('aiIn');if(i)i.focus();return}
  if(m.dataset.a==='aiundo'){
    const last=[...ADM.ai.msgs].reverse().find(x=>x.undo);if(!last)return;
    D=JSON.parse(last.undo);S=D.settings;Object.keys(CLR).forEach(k=>delete CLR[k]);Object.assign(CLR,D.colors);last.undo=null;last.lines=['Change undone'];refreshStore();dirty();renderAdmin()}
});
document.addEventListener('input',e=>{if(e.target.id==='aiIn')ADM.ai.draft=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='aiIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend()}});

document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('[data-admin]');if(m){e.preventDefault();closeAll();openAdmin()}});

syncPromo();cart=cart.filter(l=>byId(l.id));wish=wish.filter(id=>byId(id));
mount();initCaps();
